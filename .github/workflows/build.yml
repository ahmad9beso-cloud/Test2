name: Android APK (no Android Studio, no Expo account)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - run: npm ci --legacy-peer-deps

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Optional release signing (set the 4 secrets to sign with your own key)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "SAKINAH_STORE_FILE=release.keystore"
              echo "SAKINAH_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "SAKINAH_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "SAKINAH_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> android/gradle.properties
            cat >> android/app/build.gradle <<'EOF'

          android.signingConfigs {
              release {
                  storeFile file(SAKINAH_STORE_FILE)
                  storePassword SAKINAH_STORE_PASSWORD
                  keyAlias SAKINAH_KEY_ALIAS
                  keyPassword SAKINAH_KEY_PASSWORD
              }
          }
          android.buildTypes.release.signingConfig = android.signingConfigs.release
          EOF
            echo "Signing with the provided keystore."
          else
            echo "No keystore secrets: the APK will be signed with the debug key (fine for testing, not for the Play Store)."
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sakinah-apk
          path: android/app/build/outputs/apk/release/*.apk
